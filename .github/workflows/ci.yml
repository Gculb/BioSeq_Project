name: SeqCheckFlow CLI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Smoke-test FASTA and FASTQ CLI
        shell: bash
        run: |
          set -euo pipefail
          output_dir="${RUNNER_TEMP}/seqcheckflow-cli-results"

          python -m seqcheckflow.pipeline data/examples/example.fasta \
            --results-dir "${output_dir}/fasta"
          python -m seqcheckflow.pipeline data/examples/example.fastq \
            --results-dir "${output_dir}/fastq"

          test -s "${output_dir}/fasta/example_report.json"
          test -s "${output_dir}/fasta/example_report.txt"
          test -s "${output_dir}/fastq/example_report.json"
          test -s "${output_dir}/fastq/example_report.txt"
