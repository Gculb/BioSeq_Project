name: BioSeq RNA-seq

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  airway-differential-expression:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Nextflow
        uses: nf-core/setup-nextflow@v1
        with:
          version: "24.10.5"

      - name: Build RNA-seq container
        run: docker build -f containers/rnaseq.Dockerfile -t bioseq-rnaseq:latest .

      - name: Run differential-expression workflow
        run: |
          nextflow run main.nf \
            -profile docker \
            --outdir "${RUNNER_TEMP}/bioseq-rnaseq-results" \
            -with-report "${RUNNER_TEMP}/nextflow-report.html" \
            -with-trace "${RUNNER_TEMP}/nextflow-trace.txt"

      - name: Verify analysis reports
        run: |
          set -euo pipefail
          results="${RUNNER_TEMP}/bioseq-rnaseq-results"
          test -s "${results}/deseq2_results.csv"
          test -s "${results}/analysis_summary.txt"
          test -s "${results}/ma_plot.png"
          test -s "${results}/volcano_plot.png"
          test -s "${results}/session_info.txt"
          grep -q "^Conclusion:" "${results}/analysis_summary.txt"

      - name: Save analysis outputs
        uses: actions/upload-artifact@v4
        with:
          name: airway-rnaseq-results
          path: |
            ${{ runner.temp }}/bioseq-rnaseq-results/
            ${{ runner.temp }}/nextflow-report.html
            ${{ runner.temp }}/nextflow-trace.txt
