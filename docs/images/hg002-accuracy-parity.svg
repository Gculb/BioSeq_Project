<svg xmlns="http://www.w3.org/2000/svg" width="920" height="330" viewBox="0 0 920 330" role="img" aria-labelledby="title desc">
  <title id="title">HG002 regional truth-set accuracy parity</title>
  <desc id="desc">Direct-tool and SeqCheckFlow wrapper calls both have 99.62 percent precision, sensitivity, and F1 in one chromosome 20 pilot.</desc>
  <rect width="920" height="330" fill="#ffffff"/>
  <text x="36" y="42" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#172b4d">HG002 chr20 truth-set accuracy</text>
  <text x="36" y="70" font-family="Arial, sans-serif" font-size="14" fill="#526174">GIAB confident regions | one-megabase pilot | one run per implementation</text>
  <rect x="594" y="91" width="14" height="14" rx="2" fill="#355c9a"/>
  <text x="615" y="103" font-family="Arial, sans-serif" font-size="13" fill="#26354a">Direct-tool baseline</text>
  <rect x="756" y="91" width="14" height="14" rx="2" fill="#24a18a"/>
  <text x="777" y="103" font-family="Arial, sans-serif" font-size="13" fill="#26354a">SeqCheckFlow wrappers</text>
  <text x="36" y="143" font-family="Arial, sans-serif" font-size="15" fill="#26354a">Precision</text>
  <text x="36" y="207" font-family="Arial, sans-serif" font-size="15" fill="#26354a">Sensitivity</text>
  <text x="36" y="271" font-family="Arial, sans-serif" font-size="15" fill="#26354a">F1 score</text>
  <g fill="#edf1f5">
    <rect x="170" y="119" width="590" height="15" rx="4"/>
    <rect x="170" y="138" width="590" height="15" rx="4"/>
    <rect x="170" y="183" width="590" height="15" rx="4"/>
    <rect x="170" y="202" width="590" height="15" rx="4"/>
    <rect x="170" y="247" width="590" height="15" rx="4"/>
    <rect x="170" y="266" width="590" height="15" rx="4"/>
  </g>
  <g>
    <rect x="170" y="119" width="587.8" height="15" rx="4" fill="#355c9a"/>
    <rect x="170" y="138" width="587.8" height="15" rx="4" fill="#24a18a"/>
    <rect x="170" y="183" width="587.8" height="15" rx="4" fill="#355c9a"/>
    <rect x="170" y="202" width="587.8" height="15" rx="4" fill="#24a18a"/>
    <rect x="170" y="247" width="587.8" height="15" rx="4" fill="#355c9a"/>
    <rect x="170" y="266" width="587.8" height="15" rx="4" fill="#24a18a"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="12" fill="#26354a">
    <text x="773" y="131">99.62%</text><text x="773" y="150">99.62%</text>
    <text x="773" y="195">99.62%</text><text x="773" y="214">99.62%</text>
    <text x="773" y="259">99.62%</text><text x="773" y="278">99.62%</text>
  </g>
  <line x1="170" y1="294" x2="760" y2="294" stroke="#aab5c1"/>
  <text x="170" y="315" font-family="Arial, sans-serif" font-size="12" fill="#526174">0%</text>
  <text x="730" y="315" font-family="Arial, sans-serif" font-size="12" fill="#526174">100%</text>
</svg>
